name = "ink-flow-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Neon DB connection string (set via wrangler secret)
# npx wrangler secret put DATABASE_URL
# Also set: BOT_API_KEY

[[d1_databases]]
binding = "INKFLOW_DB"
database_name = "inkflow-db"
database_id = "5e462ed0-9613-4e16-85c4-8bb0494c5f4a"

