name = "harvests-cloud-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5ee6e81f1376d7f00c9dcfa141991816"

[[d1_databases]]
binding = "DB"
database_name = "harvests-db"
database_id = "97b5e650-01a7-4796-a301-b7fe3017bf2a"

[triggers]
crons = ["*/30 * * * *"]

[vars]
# NEON_DATABASE_URL must be set via `npx wrangler secret put NEON_DATABASE_URL`
# It's the connection string for Neon cloud DB (holds artists table)
# SCHEDULER_STATE = "OR"     (optional, override target state via `vars`)
# SCHEDULER_DAILY_LIMIT = 50 (optional, override via `vars`)
# 库存扣减基线：仅处理该日期(含)之后发货的 Shopify 订单；之前历史订单不扣库存。
# 用户决策 2026-08-03：今天起已发货订单才从库存扣减。
SHOPIFY_SYNC_FROM = "2026-08-03"