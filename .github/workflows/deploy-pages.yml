name: Deploy to Cloudflare Pages
"on":
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd inkflow_harvests && npm install
      - run: cd inkflow_harvests && npm run build
      - uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5ee6e81f1376d7f00c9dcfa141991816"
        with:
          command: pages deploy inkflow_harvests/dist --project-name=harvests
